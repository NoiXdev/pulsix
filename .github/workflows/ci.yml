  #       with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run e2e
  #     - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  #       if: always()
  #       with:
  #         name: playwright-ansible-report
  #         path: |
  #           web/playwright-report
  #           web/test-results
  #         retention-days: 14
  #         if-no-files-found: ignore

  docker:
    # Builds the real release artifacts — deploy/docker/Dockerfile.manager
    # and deploy/worker/Dockerfile — and runs them through scripts/smoke.sh on every push, so a broken
    # image fails here before a release tag ever reaches release.yml,
    # which builds and pushes from the exact same Dockerfile. Only the
    # amd64 image is built here (the runner's own architecture, loadable
    # straight into its local Docker daemon with a plain `docker build`);
    # release.yml is what additionally cross-builds arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by SHA like every other job (see the go job's pin table).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # github.sha is on GitHub's documented list of expressions that are
      # always a plain, safe value (a 40-hex-char commit SHA it computes
      # itself), so this isn't exploitable — but it is still routed
      # through an env var rather than interpolated straight into `run:`,
      # to match the pattern used everywhere else an expression reaches a
      # shell step in this repo (see release.yml's version-derivation
      # step) rather than relying on that distinction holding forever.
      - name: Build the manager image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f deploy/docker/Dockerfile.manager \
            -t "noixdev/pulsix-manager:$IMAGE_TAG" \
            --build-arg VERSION="$IMAGE_TAG" .
      # The compose stack's default worker container runs this image, so
      # the smoke test needs it under the same tag.
      - name: Build the worker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f deploy/worker/Dockerfile \
            -t "noixdev/pulsix-worker:$IMAGE_TAG" \
            --build-arg VERSION="$IMAGE_TAG" .
      - name: Run the release smoke test against them
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PULSIX_MASTER_KEY="$(openssl rand -hex 32)"
          export PULSIX_MASTER_KEY
          export PULSIX_VERSION="$IMAGE_TAG"
          export DB_PASSWORD="ci-smoke-test"
          export PULSIX_PUBLIC_URL="http://localhost:8080"
          scripts/smoke.sh

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # webiny/action-conventional-commits was replaced by an in-repo
      # script: its newest release (v1.3.0) still targets the deprecated
      # Node 20 runtime (runners force it onto Node 24 with a warning).
      # Range: a PR's commits on top of its base; a push's new commits
      # (before..sha), or just the pushed tip when there is no usable
      # "before" (a new branch, or a force push whose old tip is gone).
      - name: Check commit messages follow Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            scripts/check-conventional-commits.sh "${base}..${HEAD_SHA}"
          else
            scripts/check-conventional-commits.sh "${HEAD_SHA}^!"
          fi
