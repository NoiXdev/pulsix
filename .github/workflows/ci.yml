name: ci
on: [push, pull_request]

# Backlog 1.32. Without this block every job here runs with whatever the
# repository's default token permissions happen to be, which is a setting
# outside this file and can be widened without anyone touching CI. None of
# these jobs writes anything: no registry login, no secrets, no artifacts
# pushed anywhere — so read is all they get, stated here where it is
# visible next to the jobs it binds.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # Every action is pinned to the full commit SHA of its newest stable
    # release (repo constraint, backlog 1.32), each with a version comment.
    # Re-verified 2026-09-17 against `gh api repos/<owner>/<repo>/releases/latest`
    # and `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (annotated tags
    # dereferenced to their commit):
    #   actions/checkout v7.0.1         3d3c42e5aac5ba805825da76410c181273ba90b1
    #   actions/setup-go v7.0.0         b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
    #   actions/setup-node v7.0.0       820762786026740c76f36085b0efc47a31fe5020
    #   actions/setup-python v7.0.0     5fda3b95a4ea91299a34e894583c3862153e4b97
    #   actions/upload-artifact v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    #   golangci-lint-action v9.3.0     ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a (annotated tag)
    #   bufbuild/buf-action v1.5.0      8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
    # (Run 34651823450's Node 20 deprecation notices and its go1.24-built
    # golangci-lint v1.64.8 came from the older @v4/@v5/@v6 tag refs; these
    # pins run on Node 24 and install golangci-lint v2.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # 1.27.1 exactly, not "1.27". The floating minor let the runner move to
        # 1.27.2 overnight, which broke golangci-lint v2.13.2 (it cannot read
        # that toolchain's export data) and, on the very same unchanged commit,
        # dropped three helper packages' coverage far enough to fail the gate —
        # internal/api/apitest from 85.8% to 55.8%. The images have always
        # pinned golang:1.27.1-alpine by digest; CI floating while they do not
        # is what let the two drift apart, and what made a green run locally
        # mean nothing about a red one here.
        with: { go-version: "1.27.1" }
      # Backlog 2.59: pre-existing deviations (five files from v0.2b) never
      # failed CI. `gofmt -l` listing anything fails here. This runs ahead of
      # golangci-lint, which since backlog 3.25 also carries gofmt, so the
      # cheap step names the file before the slow one starts; `-s` keeps the
      # two agreeing (golangci-lint's gofmt simplifies, plain `gofmt -l` does
      # not, and an empty `import ()` slipped through that gap).
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      # golangci-lint v2.13.2 (newest stable, built with go1.27; the repo's
      # .golangci.yml is `version: "2"`): an explicit version instead of
      # `latest`, so a new linter release cannot turn main red on its own.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        # v2.14.0, not v2.13.2: the older build cannot read Go 1.27's export
        # data ("export data version 5 is greater than maximum supported
        # version 4") and failed every run on main with a typecheck error in
        # a file nobody had touched. It is also the version developers run
        # locally, which is the point — a linter that passes on a laptop and
        # fails in CI is worse than one that is merely strict.
        with: { version: v2.14.0 }
      # The gate runs the race+coverage suite in the package groups
      # scripts/test-groups.sh defines — internal/api, internal/e2e and
      # everything else, each with its own timeout (backlog 2.83 and
      # 3.21) — and prints a per-package table plus, when anything fails,
      # the failing packages' own go test output.
      - run: scripts/coverage-gate.sh
      # The agent binaries the manager embeds and serves are built by a
      # script only the release image and `make build` run, so nothing
      # above would notice it breaking (a cross-compile error, a renamed
      # output) until a release — the manager would simply ship without
      # them and answer 503 on the download route. This builds them and
      # re-runs the one package that reads the dist, which then takes its
      # with-binaries branch instead of the placeholder one. It runs after
      # the gate on purpose: a ~25 MB embed would slow every package build
      # the gate does, for no coverage gain.
      - name: agent binaries
        run: |
          scripts/agent-binaries.sh
          go test -count=1 ./internal/agentdist/...
  proto:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `buf breaking` can read the baseline commit out of
      # the local .git dir (same need as the commits job below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The breaking-change baseline is the state the change is applied to:
      #   - pull_request: the PR's base commit;
      #   - push: the branch tip before the push (github.event.before), so a
      #     push to main compares against the previous main instead of
      #     against itself (".git#branch=main" on a main push was a no-op
      #     comparison of main with main).
      # A push that has no usable baseline — a new branch (before is all
      # zeros) or a force push whose old tip is not in the clone — skips
      # the breaking check rather than guessing one; build and lint still
      # run. The SHAs come from the event payload and reach the shell only
      # through env vars.
      - name: Resolve the breaking-change baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
            echo "buf breaking baseline: $base"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no breaking-change baseline for this $EVENT_NAME event (base '${base}'); buf breaking skipped"
          fi
      # bufbuild/buf-action — newest stable release v1.5.0 (published
      # 2026-07-22), pinned to its commit SHA
      # 8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3, resolved from the release
      # tag via git ls-remote on 2026-09-14 (see the go job's pin table).
      # Runs `buf build`, `buf lint` and `buf breaking` on the proto/ module
      # (the action's own default buf install, so no separate setup step).
      # Every step is set explicitly: the action's lint/format/breaking
      # inputs default to PR-only, and `push`/`pr_comment` would engage the
      # Buf Schema Registry flow this repo does not use. format stays off
      # for now: worker.proto is kept verbatim from the contract brief,
      # which aligns trailing comments differently than `buf format` would.
      # The against input needs `subdir=proto`: the input module is the
      # proto/ directory, so without it buf compares proto/'s files
      # (pulsix/worker/v1/worker.proto) against the whole repository's
      # (proto/pulsix/worker/v1/worker.proto) and reports every file as
      # deleted.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          input: proto
          lint: true
          format: false
          breaking: ${{ steps.baseline.outputs.breaking }}
          breaking_against: ".git#ref=${{ steps.baseline.outputs.sha }},subdir=proto"
          push: false
          pr_comment: false

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --coverage
      - run: npm run build
      - name: Verify the generated API client has no drift
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
  e2e:
    runs-on: ubuntu-latest
    # A hung global-setup (a manager that never becomes ready, a stuck
    # docker compose pull/up) would otherwise run until the workflow's own
    # default six-hour ceiling — this bounds it to comfortably more than
    # the suite's own runtime plus dependency install, chromium download
    # and image pulls, so a genuine hang fails fast instead of quietly
    # eating CI minutes. Raised from 15 with v0.3a: global-setup now also
    # builds cmd/agent, and the agent journey waits on a real enrollment
    # over the manager's gRPC surface.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # web/e2e/global-setup.ts starts the same docker-compose test stack,
      # builds the SPA and the manager binary, and starts the manager
      # itself — this is the same command a contributor runs locally
      # (`npm run e2e`), not a CI-specific script.
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

  e2e-ansible:
    runs-on: ubuntu-latest
    # The milestone gate (backlog 2.12a): internal/e2e's Ansible scenario —
    # manager + worker fully wired in-process against a testcontainer
    # database, a gliderlabs/ssh host behind a jump bastion, a fixture git
    # server — runs on every PR. The default pass uses the deterministic
    # fake ansible-runner fixture; the second pass runs the REAL
    # ansible-runner (PULSIX_E2E_REAL_ANSIBLE=1) against the same
    # fixtures, which is why the worker image's Ansible runtime is installed
    # first.
    #
    # 45 minutes, raised from 15 with the v0.3b-1 check gate. Two things
    # set it. The honest runtime: three passes whose local -race times are
    # ~146 s (fake runner), the same scenario again with real ansible, and
    # a small worker/runner subset — call it 3x on a hosted runner, plus
    # the race-instrumented build of the whole dependency tree, the apt
    # and pip installs and the checkout: ~25 minutes of real work, already
    # past the old cap. The failure case: each pass now carries
    # -timeout 1800s, and a cap below "one pass panics at 30 minutes plus
    # what the other steps already spent" would kill the job before that
    # panic prints its goroutine dump — which is the whole reason the
    # per-package timeout exists. A cap only ever costs minutes on a
    # failure, so it is set to let the diagnostic out.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1" }
      # The same runtime deploy/worker/Dockerfile builds: Python 3.13,
      # ansible-core 2.21.4 + ansible-runner 2.4.3 installed into the
      # interpreter's own site-packages, and sshpass next to the runner's
      # git/openssh-client. Keep these pins in lockstep with the Dockerfile.
      #
      # Not a `pip install --user` into the system Python (what a bare
      # `pip install` on the runner falls back to): the worker runs
      # ansible-runner with HOME pointed into the job's work dir, which
      # hides ~/.local's user site-packages — ansible-runner then dies on
      # "No module named 'ansible_runner'" with exit code 1 (run
      # 35198733874).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Install the worker image's Ansible runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass
          python -m pip install --no-cache-dir "ansible-core==2.21.4" "ansible-runner==2.4.3"
          ansible-runner --version
          ansible-playbook --version
      # -timeout 1800s on every pass, for the same reason the Makefile,
      # scripts/coverage-gate.sh and CLAUDE.md carry it: go test's default
      # is 600 s PER PACKAGE, and internal/e2e is one package whose
      # -race runtime grew to 146 s locally with the v0.3b-1 check gate
      # (from 79 s) — on a hosted runner with a quarter of the cores and a
      # containerised database, a pass in the 300-450 s range is ordinary
      # and 600 s is not a comfortable ceiling. Hitting it panics the
      # package instead of failing a test, which reads as a crash rather
      # than a slow machine.
      #
      # Fast, deterministic pass (fake runner): the gate itself.
      - run: go test -race -count=1 -timeout 1800s ./internal/e2e/...
      # The real end-to-end with actual ansible: the same scenario driven
      # by the real ansible-runner binary; the harness skips this pass on
      # machines without ansible-runner (e.g. local dev), never fails it.
      - run: PULSIX_E2E_REAL_ANSIBLE=1 go test -race -count=1 -timeout 1800s ./internal/e2e/...
      # The unsafe-marker checks against the real ansible-playbook: with
      # the variable set they fail instead of skipping when it is missing.
      - run: PULSIX_E2E_REAL_ANSIBLE=1 go test -race -count=1 -timeout 1800s -run 'UnsafeMarker|RealAnsible' ./internal/worker/runner/...

  # The compose + Playwright half of the Ansible E2E (web/e2e/ansible.spec.ts,
  # project `ansible` in playwright.config.ts) STILL CANNOT run: Task 17
  # shipped the worker image (deploy/worker/Dockerfile, builds clean,
  # confirmed against a real compose stack — see task-17-report.md) and
  # wired PULSIX_GRPC_LISTEN/PULSIX_EMBEDDED_WORKER/PULSIX_GRPC_SERVER_NAME
  # plus an optional `worker` service into the PRODUCTION stack
