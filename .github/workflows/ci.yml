name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    # Third-party actions are pinned to the commit SHA of each action's
    # newest stable release (repo constraint, backlog 1.32), resolved from
    # the release tags via git ls-remote on 2026-09-14:
    #   actions/checkout v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
    #   actions/setup-go v7.0.0   b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
    #   actions/setup-node v7.0.0  820762786026740c76f36085b0efc47a31fe5020
    #   actions/upload-artifact v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    #   golangci-lint-action v9.3.0  ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
    #   bufbuild/buf-action v1.5.0  8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version: "1.27" }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with: { version: latest }
      - run: scripts/coverage-gate.sh
  proto:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `buf breaking --against '.git#branch=main'` can
      # clone the main branch out of the local .git dir (same need as the
      # commits job below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      # bufbuild/buf-action — newest stable release v1.5.0 (published
      # 2026-07-22), pinned to its commit SHA
      # 8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3, resolved from the release
      # tag via git ls-remote on 2026-09-14 (see the go job's pin table).
      # Runs `buf build`, `buf lint` and `buf breaking` on the proto/ module
      # (the action's own default buf install, so no separate setup step).
      # Every step is set explicitly: the action's lint/format/breaking
      # inputs default to PR-only, and `push`/`pr_comment` would engage the
      # Buf Schema Registry flow this repo does not use. format stays off
      # for now: worker.proto is kept verbatim from the contract brief,
      # which aligns trailing comments differently than `buf format` would.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
        with:
          input: proto
          lint: true
          format: false
          breaking: true
          breaking_against: ".git#branch=main"
          push: false
          pr_comment: false

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version: "1.27" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --coverage
      - run: npm run build
      - name: Verify the generated API client has no drift
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
  e2e:
    runs-on: ubuntu-latest
    # A hung global-setup (a manager that never becomes ready, a stuck
    # docker compose pull/up) would otherwise run until the workflow's own
    # default six-hour ceiling — this bounds it to comfortably more than
    # the suite's own ~1.5 minute runtime plus dependency install, chromium
    # download and image pulls, so a genuine hang fails fast instead of
    # quietly eating CI minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version: "1.27" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # web/e2e/global-setup.ts starts the same docker-compose test stack,
      # builds the SPA and the manager binary, and starts the manager
      # itself — this is the same command a contributor runs locally
      # (`npm run e2e`), not a CI-specific script.
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

  e2e-ansible:
    runs-on: ubuntu-latest
    # The milestone gate (backlog 2.12a): internal/e2e's Ansible scenario —
    # manager + worker fully wired in-process against a testcontainer
    # database, a gliderlabs/ssh host behind a jump bastion, a fixture git
    # server — runs on every PR. The default pass uses the deterministic
    # fake ansible-runner fixture; the second pass runs the REAL
    # ansible-runner (PULSIX_E2E_REAL_ANSIBLE=1) against the same
    # fixtures, which is why ansible-runner 2.4.3 + ansible-core 2.21.4
    # (the exact versions the worker image pins) are installed first.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version: "1.27" }
      # ansible-runner 2.4.3 and ansible-core 2.21.4 are the versions the
      # worker image ships (the pinned runner invocation's environment);
      # installing them here keeps the harness's real-ansible pass honest.
      - run: pip install ansible-runner==2.4.3 ansible-core==2.21.4
      # Fast, deterministic pass (fake runner): the gate itself.
      - run: go test -race -count=1 ./internal/e2e/...
      # The real end-to-end with actual ansible: the same scenario driven
      # by the real ansible-runner binary; the harness skips this pass on
      # machines without ansible-runner (e.g. local dev), never fails it.
      - run: PULSIX_E2E_REAL_ANSIBLE=1 go test -race -count=1 ./internal/e2e/...

  # The compose + Playwright half of the Ansible E2E (web/e2e/ansible.spec.ts,
  # project `ansible` in playwright.config.ts) CANNOT run yet: the compose
  # test stack has no pulsix worker service until Task 17 lands the worker
  # image (and with it the ssh-host / bastion / git-server fixtures and
  # their enrollment plumbing). It activates on merges to main and the
  # nightly schedule only, per the plan's merge-gate policy. To activate:
  #   1. Task 17 adds the worker + ssh-host + bastion + git-server services
  #      to deploy/compose (with the enrollment env from its own task).
  #   2. Uncomment this job; web/e2e/ansible.spec.ts's
  #      workerServiceAvailable() guard stops skipping on its own, and the
  #      spec runs the same assertions the Go harness does, through the UI.
  # e2e-ansible-ui:
  #   if: github.event_name != 'pull_request'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 25
  #   defaults:
  #     run:
  #       working-directory: web
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  #     - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
  #       with: { go-version: "1.27" }
  #     - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
  #       with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run e2e
  #     - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
  #       if: always()
  #       with:
  #         name: playwright-ansible-report
  #         path: |
  #           web/playwright-report
  #           web/test-results
  #         retention-days: 14
  #         if-no-files-found: ignore

  docker:
    # Builds the real release artifact — deploy/docker/Dockerfile.manager
    # — and runs it through scripts/smoke.sh on every push, so a broken
    # image fails here before a release tag ever reaches release.yml,
    # which builds and pushes from the exact same Dockerfile. Only the
    # amd64 image is built here (the runner's own architecture, loadable
    # straight into its local Docker daemon with a plain `docker build`);
    # release.yml is what additionally cross-builds arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1 — this job's own step, pinned to the
      # newest stable release as of 2026-09-11 (commit
      # 3d3c42e5aac5ba805825da76410c181273ba90b1, the same SHA the other
      # jobs pin since the task-3 fix round; see task-16-report.md).
      - uses: actions/checkout@v7.0.1
      # github.sha is on GitHub's documented list of expressions that are
      # always a plain, safe value (a 40-hex-char commit SHA it computes
      # itself), so this isn't exploitable — but it is still routed
      # through an env var rather than interpolated straight into `run:`,
      # to match the pattern used everywhere else an expression reaches a
      # shell step in this repo (see release.yml's version-derivation
      # step) rather than relying on that distinction holding forever.
      - name: Build the manager image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f deploy/docker/Dockerfile.manager \
            -t "noixdev/pulsix-manager:$IMAGE_TAG" \
            --build-arg VERSION="$IMAGE_TAG" .
      - name: Run the release smoke test against it
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PULSIX_MASTER_KEY="$(openssl rand -hex 32)"
          export PULSIX_MASTER_KEY
          export PULSIX_VERSION="$IMAGE_TAG"
          export DB_PASSWORD="ci-smoke-test"
          export PULSIX_PUBLIC_URL="http://localhost:8080"
          scripts/smoke.sh

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: webiny/action-conventional-commits@v1.3.0
