  #   2. web/e2e/global-setup.ts: set PULSIX_GRPC_LISTEN (and
  #      PULSIX_EMBEDDED_WORKER=0 — the UI spec drives one named worker
  #      deliberately, not the embedded one) on the manager's env, run
