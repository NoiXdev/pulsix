name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }
      - run: scripts/coverage-gate.sh
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --coverage
      - run: npm run build
      - name: Verify the generated API client has no drift
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
  e2e:
    runs-on: ubuntu-latest
    # A hung global-setup (a manager that never becomes ready, a stuck
    # docker compose pull/up) would otherwise run until the workflow's own
    # default six-hour ceiling — this bounds it to comfortably more than
    # the suite's own ~1.5 minute runtime plus dependency install, chromium
    # download and image pulls, so a genuine hang fails fast instead of
    # quietly eating CI minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # web/e2e/global-setup.ts starts the same docker-compose test stack,
      # builds the SPA and the manager binary, and starts the manager
      # itself — this is the same command a contributor runs locally
      # (`npm run e2e`), not a CI-specific script.
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

  docker:
    # Builds the real release artifact — deploy/docker/Dockerfile.manager
    # — and runs it through scripts/smoke.sh on every push, so a broken
    # image fails here before a release tag ever reaches release.yml,
    # which builds and pushes from the exact same Dockerfile. Only the
    # amd64 image is built here (the runner's own architecture, loadable
    # straight into its local Docker daemon with a plain `docker build`);
    # release.yml is what additionally cross-builds arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1 — this job's own step, pinned to the
      # newest stable release as of 2026-09-11; the other jobs in this
      # file keep their existing pinned versions untouched (out of scope
      # for this change, see task-16-report.md).
      - uses: actions/checkout@v7.0.1
      - name: Build the manager image
        run: |
          docker build -f deploy/docker/Dockerfile.manager \
            -t noixdev/pulsix-manager:${{ github.sha }} \
            --build-arg VERSION=${{ github.sha }} .
      - name: Run the release smoke test against it
        run: |
          PULSIX_MASTER_KEY="$(openssl rand -hex 32)"
          export PULSIX_MASTER_KEY
          export PULSIX_VERSION="${{ github.sha }}"
          export DB_PASSWORD="ci-smoke-test"
          export PULSIX_PUBLIC_URL="http://localhost:8080"
          scripts/smoke.sh

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: webiny/action-conventional-commits@v1.3.0
