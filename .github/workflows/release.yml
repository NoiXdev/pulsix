# Cuts a Pulsix release: one `vX.Y.Z` tag on `main` builds and pushes the
# multi-arch manager and worker images, each tagged with that version and
# `latest`, to both registries. This is the project's
# single-version-for-everything rule (see the v0.1 core plan): the compose
# stack runs both images under one PULSIX_VERSION, so they must always be
# released together; later milestones add the agent binaries under the
# same tag rather than introducing per-component tags.
name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # A tag push is only ever triggered by someone with write access to
    # this repository creating a tag — GitHub does not fire `push` events
    # for tags from a fork's pull request, so this workflow, and the
    # registry credentials below, are never reachable from a PR. This
    # `permissions` block additionally keeps GITHUB_TOKEN itself
    # read-only: pushing the built image uses the registry secrets below
    # instead, GITHUB_TOKEN is not involved in that at all.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # github.ref_name is interpolated into an env var, never directly
      # into the run: script — interpolating an expression straight into
      # `run:` is the script-injection pattern GitHub's hardening guidance
      # warns about (a crafted tag name would otherwise execute in the
      # runner's shell). The value is also validated to look like
      # vMAJOR.MINOR.PATCH before it is used for anything, so a malformed
      # or hostile tag fails the workflow here instead of reaching the
      # build/push step below.
      - name: Derive the release version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' does not look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # QEMU is what makes the arm64 half of the build possible on an
      # amd64 GitHub-hosted runner (user-mode emulation for the "COPY
      # --from=web"/"go build" stages' non-native instructions); Buildx is
      # the builder that actually understands --platform and produces one
      # multi-arch manifest list per tag below.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.cloud.noidee.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push the manager image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.manager
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            noixdev/pulsix-manager:${{ steps.version.outputs.version }}
            noixdev/pulsix-manager:latest
            harbor.cloud.noidee.dev/noixdev/pulsix-manager:${{ steps.version.outputs.version }}
            harbor.cloud.noidee.dev/noixdev/pulsix-manager:latest

      - name: Build and push the worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            noixdev/pulsix-worker:${{ steps.version.outputs.version }}
            noixdev/pulsix-worker:latest
            harbor.cloud.noidee.dev/noixdev/pulsix-worker:${{ steps.version.outputs.version }}
            harbor.cloud.noidee.dev/noixdev/pulsix-worker:latest
