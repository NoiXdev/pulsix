# Cuts a Pulsix release through the organization's shared Docker release
# workflow (NoiXdev/github-workflows, create_docker_changelog_version_release):
# it computes the next version, writes it into version.json, builds the
# multi-architecture manager and worker images with that version as their
# VERSION build argument, pushes both to Docker Hub (and to Harbor once
# vars.HARBOR_NAMESPACE is set), commits the version and CHANGELOG.md to
# main, tags, creates the GitHub release and announces it on Discord. One
# version for everything (the v0.1 core plan's rule): the compose stack runs
# both images under one PULSIX_VERSION.
#
# Started by hand from the Actions tab. A pre-release (prerelease_id rc, beta
# or alpha) publishes its version tag only; `latest` stays on the last final
# release. dry_run builds everything and pushes nothing - the rehearsal to
# run first.
name: release
run-name: Release Pulsix (${{ inputs.bump }}${{ inputs.prerelease_id != 'none' && format(', {0}', inputs.prerelease_id) || '' }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: minor
      prerelease_id:
        description: "Pre-release identifier: rc, beta or alpha; none for a final release"
        type: choice
        options: [none, rc, beta, alpha]
        default: rc
      dry_run:
        description: "Build everything, push nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Backlog 1.32: only a green commit on main is published. The shared
  # workflow releases exactly the commit this job checked (its `ref` input),
  # not whatever main points at by the time the build starts.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: The release must start from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a release is only ever cut from main, not $REF" >&2
            exit 1
          fi

      - name: CI must have passed for that commit
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # The newest ci run for this exact commit that was a push to main.
          # A run for the same SHA from a pull request or another branch does
          # not count, and no run at all is a failure: "never tested" must not
          # publish either.
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci for $SHA concluded '$conclusion'; only a green commit is published" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    permissions:
      contents: write
    # Pinned by commit, never @main (backlog 7.16): `secrets: inherit` hands
    # the registry credentials and the Discord webhook to whatever this
    # reference resolves to.
    uses: NoiXdev/github-workflows/.github/workflows/create_docker_changelog_version_release.yaml@22bede08a78f3a9757587f46a31796963d01b948 # main, 2026-11-09
    with:
      bump: ${{ inputs.bump }}
      prerelease_id: ${{ inputs.prerelease_id != 'none' && inputs.prerelease_id || '' }}
      dry_run: ${{ inputs.dry_run }}
      ref: ${{ needs.guard.outputs.sha }}
      product_name: Pulsix
      platforms: linux/amd64,linux/arm64
      version_file: version.json
      # The manager image is the main one (vars.DOCKERHUB_IMAGE =
      # pulsix-manager); the worker ships with it under the same version.
      dockerfile: deploy/docker/Dockerfile.manager
      extra_image: pulsix-worker
      extra_image_dockerfile: deploy/worker/Dockerfile
      version_build_arg: VERSION
      # Harbor is opt-in through the repository variable HARBOR_NAMESPACE
      # (with the secrets HARBOR_USERNAME and HARBOR_PASSWORD); unset, the
      # images go to Docker Hub only.
      harbor_namespace: ${{ vars.HARBOR_NAMESPACE }}
    secrets: inherit
