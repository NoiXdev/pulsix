# Single-node deployment for the Pulsix manager. Run from this directory
# (or point --env-file/-f at it from elsewhere) with an actual .env copied
# from .env.example — see that file and README.md for what each variable
# means and why every one of them is required, not merely a suggestion.
#
# Every ${VAR:?message} below is deliberate: Compose's own interpolation
# refuses to start any service — not just fails a healthcheck later — the
# moment a required variable is unset or empty, so a copy-pasted .env with
# a blank secret is caught at `docker compose up` time, before the manager
# or the database ever runs with one.
# What the manager and the one-off `cli` service below share: the image,
# the environment and the backup volume. One definition, so the two cannot
# drift apart.
x-manager-base: &manager-base
  image: noixdev/pulsix-manager:${PULSIX_VERSION:-latest}
  environment:
    # The "pulsix" role the `db` service below creates (POSTGRES_USER)
    # owns the schema (it ran the migrations that created pulsix_app and
    # granted it — migration 00002_rls.sql) and is therefore, in Postgres terms, a
    # superuser-equivalent for this database: it can bypass row-level
    # security entirely. That is fine ONLY because internal/app.Build
    # never serves a single request through this connection string
    # directly — it opens it once to run migrations, then reopens as
    # the least-privilege pulsix_app role via SET ROLE and REFUSES TO
    # START if that role could still bypass RLS (see
    # internal/app/app.go's assertCannotBypassRLS). Do not point this at
    # a role you have not verified is not itself a superuser or
    # BYPASSRLS unless you trust the same guard to catch it.
    PULSIX_DATABASE_URL: "postgres://pulsix:${DB_PASSWORD:?set DB_PASSWORD in .env (openssl rand -hex 32)}@db:5432/pulsix?sslmode=disable"
    PULSIX_MASTER_KEY: "${PULSIX_MASTER_KEY:?run: openssl rand -hex 32}"
    PULSIX_PUBLIC_URL: "${PULSIX_PUBLIC_URL:?e.g. https://pulsix.example.com}"
    PULSIX_STATUS_DOMAIN: "${PULSIX_STATUS_DOMAIN:-}"
    # The worker endpoint (spec §17): bound on every interface inside the
    # container, so the `worker` service below reaches it over the
    # compose network as "manager:8444". It is NOT published on the host:
    # nothing outside this compose network needs it by default. To serve
    # a worker running on another machine, publish it deliberately (see
    # README.md, "Workers on other machines"). PULSIX_GRPC_SERVER_NAME
    # gives the endpoint's server certificate a fixed name — the manager
    # binds ":8444", which names no host of its own — and every worker
    # must present that same name as its PULSIX_MANAGER_SERVER_NAME.
    PULSIX_GRPC_LISTEN: "${PULSIX_GRPC_LISTEN:-:8444}"
    PULSIX_GRPC_SERVER_NAME: "${PULSIX_GRPC_SERVER_NAME:-pulsix-manager}"
    # Off by default, and only for trusted single-tenant setups: when on,
    # playbooks run inside THIS container, next to PULSIX_MASTER_KEY and
    # PULSIX_DATABASE_URL (a playbook task on localhost can read them),
    # and this image has no Ansible runtime, so only connection tests
    # would work. The `worker` service below is the default instead.
    PULSIX_EMBEDDED_WORKER: "${PULSIX_EMBEDDED_WORKER:-0}"
    # The reverse proxies whose X-Forwarded-For the manager believes
    # (CIDRs or addresses, comma separated). The default is the bundled
    # Traefik's fixed address below (PULSIX_PROXY_ADDR), which no other
    # container can receive: it lies outside the network's dynamic
    # range. Behind a proxy of your own, set it to that proxy's address
    # — otherwise every caller looks like the proxy, webhook IP
    # allowlists never match and audit entries record the proxy.
    PULSIX_TRUSTED_PROXIES: "${PULSIX_TRUSTED_PROXIES:-${PULSIX_PROXY_ADDR:-10.213.73.254}}"
  volumes:
    # The backup folder (README.md, "Backup and restore"): where backups
    # go unless the web interface names S3-compatible storage, and where
    # `docker compose run --rm cli restore` looks by default.
    - pulsix-backups:/var/lib/pulsix/backups

services:
  db:
    # Keep this in sync with deploy/compose/docker-compose.test.yml's own
    # `db` service — the e2e suite and this production stack must run the
    # exact same TimescaleDB/PostgreSQL version.
    image: timescale/timescaledb:2.30.0-pg18
    environment:
      POSTGRES_DB: pulsix
      POSTGRES_USER: pulsix
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env (openssl rand -hex 32)}"
    volumes:
      # Mounted at /var/lib/postgresql (the parent directory), not
      # .../data: the PG18+ image places data in a major-version-specific
      # subdirectory of this parent and refuses to start if something
      # else (an empty bind/volume from the old pre-18 convention) is
      # already mounted at .../data — see
      # https://github.com/docker-library/postgres/pull/1259 and
      # docker-compose.test.yml's own comment on the exact same issue.
      # Unlike that test-only stack's tmpfs, this is a real named volume
      # so data survives `docker compose down` (but not `down -v`).
      - pulsix-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsix -d pulsix"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  manager:
    <<: *manager-base
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host-side port is overridable (default 8080) for a machine that
      # already has something bound to 8080 — the container always
      # listens on 8080 internally, matching PULSIX_LISTEN's own default.
      - "${PULSIX_HOST_PORT:-8080}:8080"
    # An init (PID 1) that reaps what its children orphan (backlog 2.111),
    # for the embedded worker above: with PULSIX_EMBEDDED_WORKER=1 it runs
    # inside this process and has the same orphan paths as the `worker`
    # service (see its own init: true). It changes nothing else for the
    # manager, which starts no other children.
    init: true
    restart: unless-stopped
    # Traefik reads its routing entirely from labels on the container it
    # routes to. These labels are inert unless the `proxy` profile is
    # enabled (no Traefik provider is watching them otherwise), so they
    # are safe to leave in place for every deployment — with or without a
    # proxy in front of the manager.
    labels:
      - traefik.enable=true
      - "traefik.http.routers.pulsix.rule=Host(`${PULSIX_DOMAIN:-pulsix.localhost}`)"
      - traefik.http.routers.pulsix.entrypoints=websecure
      - traefik.http.routers.pulsix.tls.certresolver=letsencrypt
      - traefik.http.services.pulsix.loadbalancer.server.port=8080

  # The manager's commands, run one-off: backup, restore, worker add.
  #   docker compose run --rm cli backup
  # Same image, environment and volumes as the manager (x-manager-base),
  # but no Traefik labels and no ports: a one-off container of the
  # `manager` service would carry its labels, and with the `proxy` profile
  # active Traefik would send part of the requests to it — a container
  # that does not serve HTTP — for as long as the command runs. The `cli`
  # profile keeps `docker compose up` from ever starting it.
  cli:
    <<: *manager-base
    profiles: [cli]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot enrollment for the `worker` service below. It is the only
  # container besides the manager (and the one-off `cli` commands) that
  # holds the database URL and the master key, and it runs no playbooks: it waits until the zone exists
  # (on a fresh instance: until the setup wizard has created the first
  # organization), issues and registers the worker's certificate, writes
  # the bundle into the pulsix-worker-bundle volume and exits. On every
  # later `docker compose up` it finds the bundle still valid and exits
  # without registering another worker — checked before the zone is looked
  # up, so a later second organization does not break it. A first
  # enrollment on an instance where several organizations have the zone
  # slug fails with a message asking for PULSIX_WORKER_ORG; the bounded
  # restart policy keeps that from spinning forever. --replace serves a
  # restore on a new server: the restored database already knows the
  # worker's name, but the new server has no bundle for it, so the old
  # registration is revoked and replaced. A revoked worker is never
  # replaced (see README.md, "If the bundled worker was revoked").
  worker-enroll:
    image: noixdev/pulsix-manager:${PULSIX_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
      manager:
        condition: service_started
    command:
      - worker
      - add
      - --zone=${PULSIX_WORKER_ZONE:-default}
      - --org=${PULSIX_WORKER_ORG:-}
      - --name=${PULSIX_WORKER_NAME:-worker-1}
      - --bundle-dir=/var/lib/pulsix/worker-bundle
      - --wait
      - --replace
    environment:
      PULSIX_DATABASE_URL: "postgres://pulsix:${DB_PASSWORD:?set DB_PASSWORD in .env (openssl rand -hex 32)}@db:5432/pulsix?sslmode=disable"
      PULSIX_MASTER_KEY: "${PULSIX_MASTER_KEY:?run: openssl rand -hex 32}"
      PULSIX_PUBLIC_URL: "${PULSIX_PUBLIC_URL:?e.g. https://pulsix.example.com}"
      PULSIX_GRPC_SERVER_NAME: "${PULSIX_GRPC_SERVER_NAME:-pulsix-manager}"
    volumes:
      - pulsix-worker-bundle:/var/lib/pulsix/worker-bundle
    restart: on-failure:3

  # The zone worker that runs the playbooks. It holds no database access
  # and no master key — only its own certificate bundle and the address of
  # the manager's worker endpoint. It waits for the bundle the enrollment
  # service above writes, then starts claiming jobs for the zone it was
  # enrolled for (by default the first organization's "default" zone). The
  # bundle volume is writable for the worker because it renews its own
  # certificate (90-day leaves); worker-enroll keeps reusing the renewed
  # bundle.
  worker:
    image: noixdev/pulsix-worker:${PULSIX_VERSION:-latest}
    depends_on:
      worker-enroll:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /etc/pulsix-worker/cert.pem ] && [ -s /etc/pulsix-worker/key.pem ] && [ -s /etc/pulsix-worker/ca.pem ]; do
          echo "pulsix-worker: waiting for enrollment (complete the setup wizard first) ..."
          sleep 5
        done
        exec /pulsix-worker
    environment:
      # PULSIX_MANAGER_SERVER_NAME must be exactly the manager's
      # PULSIX_GRPC_SERVER_NAME: the server certificate names that value,
      # not "manager", so the handshake only succeeds when the two agree.
      PULSIX_MANAGER_ADDR: "manager:8444"
      PULSIX_MANAGER_SERVER_NAME: "${PULSIX_GRPC_SERVER_NAME:-pulsix-manager}"
      PULSIX_WORKER_CERT: /etc/pulsix-worker/cert.pem
      PULSIX_WORKER_KEY: /etc/pulsix-worker/key.pem
      PULSIX_CA_CERT: /etc/pulsix-worker/ca.pem
      # Playbooks run under the image's second, unprivileged account
      # (pulsix-play, uid 65533) instead of the worker's own, so a task
      # aimed at the worker itself cannot read the certificate and key
      # above. It is set HERE and not in the image on purpose: an upgrade
      # must never turn it on behind an operator's back, and 65533 only
      # exists in the Pulsix worker image — a derived image or a
      # bind-mounted data directory may not know the uid at all.
      # Set PULSIX_WORKER_PLAY_UID= (empty) in your .env to turn it off;
      # playbooks then run as the worker, as they did before v0.4.
      PULSIX_WORKER_PLAY_UID: "${PULSIX_WORKER_PLAY_UID-65533}"
    volumes:
      - pulsix-worker-bundle:/etc/pulsix-worker
      - pulsix-worker-data:/var/lib/pulsix-worker
    # An init (PID 1) that reaps what its children orphan (backlog 2.108).
    # Cancelling a run no longer leaves its play behind: the worker starts
    # every run under a per-run supervisor that stops and reaps the whole
    # tree. Other paths can still orphan a process into PID 1 though (a
    # repository sync's `ssh` outliving its killed `git`, or a supervisor
    # that had to be killed), and the worker binary only waits for what it
    # started itself. Without this, those become zombies until the
    # container restarts. A plain `docker run` needs `--init` for the same.
    init: true
    restart: unless-stopped

  # Optional TLS-terminating reverse proxy, only started with:
  #   docker compose --profile proxy up -d
  # Not part of the default `docker compose up`: an operator behind their
  # own load balancer or reverse proxy (or just testing over plain HTTP on
  # localhost) has no use for a second one, and scripts/smoke.sh — which
  # talks to the manager directly on :8080 — never enables this profile.
  traefik:
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    profiles: [proxy]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # Deliberately a soft default (:-), not the hard :? guard used for
      # every other secret in this file: Compose interpolates every
      # service in this file up front, even ones no active --profile
      # will start, so a :? here would make a plain `docker compose up`
      # (proxy profile never requested) refuse to start over a variable
      # that deployment does not even use. An empty ACME email only
      # matters, and only fails, once --profile proxy actually starts
      # this container — and it fails loudly in Traefik's own logs when
      # it does.
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}"
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    # A fixed address outside the network's dynamic range, so the
    # manager's PULSIX_TRUSTED_PROXIES default can name exactly this
    # container and nothing else.
    networks:
      default:
        ipv4_address: "${PULSIX_PROXY_ADDR:-10.213.73.254}"
    volumes:
      - pulsix-letsencrypt:/letsencrypt
      # Read-only: Traefik only needs to list/watch containers and their
      # labels to build its routing table, never to create or modify them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

# The stack's network has a fixed subnet so the bundled Traefik gets a
# fixed address (above). Containers draw their addresses from the lower
# half only (ip_range); the proxy's address sits in the upper half. The
# default range lies outside Docker's own address pools; change all three
# PULSIX_NETWORK_SUBNET, PULSIX_NETWORK_RANGE and PULSIX_PROXY_ADDR
# together if it collides with a network of yours.
networks:
  default:
    ipam:
      config:
        - subnet: "${PULSIX_NETWORK_SUBNET:-10.213.73.0/24}"
          ip_range: "${PULSIX_NETWORK_RANGE:-10.213.73.0/25}"

volumes:
  pulsix-backups:
  pulsix-db:
  pulsix-letsencrypt:
  pulsix-worker-bundle:
  pulsix-worker-data:
