# pulsix.rotate_key.yml — mirrors pulsix.bootstrap.yml with only the
# key-install tasks: it runs with the credential being rotated (the old
# login, still valid on the host) and installs the new public key. Only
# ansible-core's own modules, like the bootstrap (backlog 7.46).
- hosts: all
  become: true
  gather_facts: false
  vars:
    pulsix_account: "{{ pulsix_user | default('ansible') }}"
  tasks:
    - name: Look up the account's home
      ansible.builtin.getent:
        database: passwd
        key: "{{ pulsix_account }}"
    - name: Ensure the account's .ssh directory
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[pulsix_account][4] }}/.ssh"
        state: directory
        owner: "{{ pulsix_account }}"
        mode: "0700"
    - name: Install new public key
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.getent_passwd[pulsix_account][4] }}/.ssh/authorized_keys"
        line: "{{ pulsix_public_key | trim }}"
        create: true
        owner: "{{ pulsix_account }}"
        mode: "0600"
