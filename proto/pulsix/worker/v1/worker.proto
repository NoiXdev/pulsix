syntax = "proto3";

package pulsix.worker.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/noixdev/pulsix/internal/pb/workerpb";

service WorkerService {
  // ClaimJob atomically claims one queued job of one of the worker's zones
  // (SELECT ... FOR UPDATE SKIP LOCKED) and returns its full payload,
  // including the rendered inventory snapshot and revealed credential
  // secrets. Empty response with no job means "queue empty".
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  // RunEvents streams a run's events after a successful claim. The worker
  // sends events; the manager may answer with a cancel directive. Closing
  // the stream without a terminal event makes the manager re-queue the job.
  rpc RunEvents(stream RunEvent) returns (stream ManagerDirective);
  // ReportResult is the terminal unary call: the worker reports the final
  // status and per-host stats. Sent after the last RunEvents message.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
  // Enroll exchanges a one-time enrollment token and a certificate
  // request for the worker's first client certificate. It is the only
  // method callable without a client certificate; the worker pins the CA
  // by the fingerprint in its token before sending anything.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // RenewCertificate issues a fresh certificate for the calling worker's
  // key. The old certificate stays valid until it expires.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // ListRepositories returns the calling worker's organization and the ids
  // of every repository it has. The worker removes the cached clones and
  // requirements installs of every other repository (backlog 7.95).
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}

message ClaimJobRequest {
  string version = 1;                // worker build version, recorded on the worker
  repeated string zone_ids = 2;      // the zones this worker serves (uuids)
  // cancel_stops_play says that cancelling a job this worker runs stops
  // the play on the worker, not only the worker's following of it: true
  // when the worker runs plays under the per-run play supervisor (backlog
  // 2.107). The manager records it on the claimed job, so the run view can
  // tell a cancelled run whose play may still be running from one whose
  // play was stopped. Workers older than the field never send it, which
  // reads as false, the cautious answer.
  bool cancel_stops_play = 3;
}

message ClaimJobResponse {
  // job is empty when the queue has nothing for these zones.
  Job job = 1;
}

message Job {
  string id = 1;                     // uuid
  string kind = 2;                   // run | adhoc | connection_test | bootstrap | rotate_key | sync_repo
  string org_id = 3;                 // uuid
  string zone_id = 4;                // uuid
  string template_id = 5;            // uuid, empty for non-run kinds
  string playbook = 6;               // inline YAML or "repo:<repo-id>:<subpath>"
  string limit = 7;
  map<string, string> extra_vars = 8;   // JSON-encoded values
  string ssh_username = 9;
  // inventory_doc is the dynamic-inventory JSON with secrets revealed.
  string inventory_doc = 10;
  // connections maps hostname to the rendered Connection JSON.
  map<string, string> connections = 11;
  // credentials maps credential uuid to the revealed Secret JSON. Only
  // credentials the snapshot references. Never logged.
  map<string, string> credentials = 12;
  // host_keys maps hostname to the pinned public-key fingerprint
  // ("SHA256:..."), present when the host has a pin the worker must verify.
  map<string, string> host_keys = 13;
  // kind_payload carries kind-specific JSON (bootstrap login, rotation
  // keys, adhoc argv). Never logged.
  string kind_payload = 14;
  string worker_token = 15;          // echoes the claim for stream binding
  // known_hosts maps hostname to the pinned host's full public key in
  // authorized-key form ("ssh-ed25519 AAAA..."), one entry for every host
  // in host_keys. The worker writes them into the run's known_hosts and
  // connects to those hosts with strict host key checking; a host in
  // host_keys without an entry here fails the run closed.
  map<string, string> known_hosts = 16;
  // redact lists every secret value this claim reveals — credential
  // secrets, secret-typed extra vars, secret inventory vars, one-time
  // logins — which the worker removes from every run event (payload and
  // stdout) before it leaves the worker. Never logged.
  repeated string redact = 17;
  // bastion_host_keys maps the bastion uuid to the pinned jump host's
  // public-key fingerprint ("SHA256:..."), for every pinned bastion the
  // job's route dials (a run's hop chain, a connection test's hops). The
  // worker verifies each hop against the pin — a probe aborts before
  // authenticating through a changed bastion, a run's ssh_config demands
  // the pinned key per hop alias.
  map<string, string> bastion_host_keys = 18;
  // bastion_known_hosts maps the bastion uuid to the pinned jump host's
  // full public key in authorized-key form ("ssh-ed25519 AAAA..."), one
  // entry for every bastion in bastion_host_keys. The worker writes them
  // into the run's known_hosts under the hop aliases; a bastion in
  // bastion_host_keys without an entry here fails the job closed.
  map<string, string> bastion_known_hosts = 19;
  reserved 20;  // was string vault_credential_id, replaced by the repeated
                // field below. Never reuse the number: a worker built
                // against the old descriptor would read the new bytes as a
                // malformed string rather than failing cleanly.
  // the name, alongside the number: this is what makes the deletion
  // legible to buf breaking under WIRE_JSON (see buf.yaml) and to the
  // next reader.
  reserved "vault_credential_id";
  // vault_identities carries the run's resolved labelled Ansible Vault
  // passwords: the union of its repository's set and its job template's,
  // with the template winning a label collision
  // (internal/repos.ResolveVaultIdentities). Empty means the repository
  // has no vault at all. Each entry's credential_id names an entry in
  // `credentials` above; the passphrase itself travels in that map like
  // every other revealed secret and is redacted like every other. The
  // worker writes one password file per entry and points the run's
  // ansible.cfg at all of them by label (vault_identity_list), which is
  // what lets one playbook mix files encrypted under different passwords.
  repeated VaultIdentity vault_identities = 21;
}

// VaultIdentity is one labelled Ansible Vault password, already resolved
// for this run — the manager hands the worker the answer, never the
// merge rule that produced it.
message VaultIdentity {
  string credential_id = 1;  // uuid naming the entry in Job.credentials
  string label = 2;          // Ansible vault id; must match the one used to encrypt
}

message RunEvent {
  string job_id = 1;
  uint64 seq = 2;
  string host = 3;
  string task = 4;
  string state = 5;                  // ok | failed | skipped | changed | unreachable | stdout | run_start | run_end
  string payload = 6;                // JSON
  google.protobuf.Timestamp at = 7;
}

message ManagerDirective { bool cancel = 1; }

message ReportResultRequest {
  string job_id = 1;
  string status = 2;                 // succeeded | failed | cancelled | error
  string stats = 3;                  // JSON: per-host ok/failed/skipped/changed counts
  string error = 4;                  // human-readable failure reason, empty on success
}

message ReportResultResponse {}

message EnrollRequest {
  string token_id = 1;   // the enrollment id (uuid) from the token
  bytes secret = 2;      // the token's 32-byte secret
  bytes csr = 3;         // PEM "CERTIFICATE REQUEST"
  string version = 4;    // worker build version
}

message EnrollResponse {
  bytes certificate = 1; // PEM leaf
  bytes ca_chain = 2;    // PEM CA certificate
  string worker_id = 3;
}

message RenewCertificateRequest {
  bytes csr = 1;         // PEM "CERTIFICATE REQUEST"
}

message RenewCertificateResponse {
  bytes certificate = 1; // PEM leaf
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  string org_id = 1;               // uuid of the worker's organization
  repeated string repo_ids = 2;    // uuids; empty when it has none
}
