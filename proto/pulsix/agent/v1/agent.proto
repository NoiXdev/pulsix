syntax = "proto3";

package pulsix.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/noixdev/pulsix/internal/pb/agentpb";

service AgentService {
  // Enroll exchanges a one-time enrollment token and a certificate request
  // for the agent's first client certificate. It is the only method callable
  // without a client certificate; the agent pins the CA by the fingerprint
  // in its token before sending anything.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Renew issues a fresh certificate for the calling agent's key. Identity
  // comes from the client certificate; the swap revokes the previous serial
  // in the same transaction, so the agent reconnects with the new
  // certificate right away.
  rpc Renew(RenewRequest) returns (EnrollResponse);
  // AgentStream is the agent's long-lived bidirectional stream. The agent
  // sends heartbeats and facts; the manager may answer with acknowledgements.
  rpc AgentStream(stream AgentMessage) returns (stream ManagerMessage);
}

message EnrollRequest {
  string token = 1; // the one-time enrollment token
  string csr_pem = 2; // PEM "CERTIFICATE REQUEST"
  string name = 3; // requested hostname
  string version = 4; // agent build version
}

message EnrollResponse {
  string cert_pem = 1; // PEM leaf
  string ca_pem = 2; // PEM CA certificate
  string host_id = 3;
}

message RenewRequest {
  string csr_pem = 1; // PEM "CERTIFICATE REQUEST"
}

message AgentMessage {
  oneof body {
    Heartbeat heartbeat = 1; // periodic liveness signal
    Facts facts = 2; // gathered host facts
    CheckResults check_results = 3; // check measurement results
    // Results of the probes the manager assigned to this agent (ProbeConfig).
    ProbeResults probe_results = 4;
  }
}

message Heartbeat {
  string version = 1; // agent build version
  string config_version = 2; // what the agent is currently running
  // The names of the secrets in the agent's local configuration file
  // (agent.yaml), sorted; never a secret's fields.
  repeated string secret_names = 3;
  // The configuration file's state: "absent", "ok" or the error that made
  // the agent drop every secret (it never quotes the file). Empty from an
  // agent older than the file.
  string secrets_state = 4;
  // The local checks the agent runs from its configuration file's checks
  // section, key order: the file's valid entries minus the keys a check
  // from the manager shadows. Empty from an agent older than the section.
  repeated LocalCheck local_checks = 5;
  // Why some of the file's local checks do not run: the refused entries
  // ("line N: <reason>", line order), then each key a check from the
  // manager shadows. At most 32 entries.
  repeated string local_check_problems = 6;
  // Whether this agent probes other hosts' synthetic checks on the
  // manager's assignment (ProbeConfig). False from an agent older than
  // probe vantage points; such an agent is never assigned a probe.
  bool probes_supported = 7;
  // The ProbeConfig.version the agent currently runs; "" when it has none.
  string probe_config_version = 8;
}

// LocalCheck is a check defined in the agent's own configuration file.
message LocalCheck {
  string key = 1;
  string plugin = 2;
  string params_json = 3; // canonical JSON
  int32 interval_seconds = 4;
}

message Facts {
  map<string, string> values = 1;
}

message CheckResults {
  repeated CheckResult results = 1;
}

message CheckResult {
  string check_key = 1;
  string item = 2; // "" for whole-host metrics
  string metric = 3;
  google.protobuf.Timestamp at = 4;
  oneof observation {
    double value = 5;
    string label = 6;
    string error = 7; // collection failed; no sample is stored
  }
}

message ManagerMessage {
  bool ack = 1;
  optional CheckConfig check_config = 2;
  // The probes this agent runs for other hosts, sent on a heartbeat's ack
  // when the agent reports probes_supported and a probe_config_version
  // other than the manager's.
  optional ProbeConfig probe_config = 3;
}

message CheckConfig {
  string version = 1;
  repeated CheckSpec checks = 2;
}

message CheckSpec {
  string key = 1;
  string plugin = 2;
  string params_json = 3; // canonical JSON, as the version hashes it
  int32 interval_seconds = 4;
}

// ProbeConfig is the complete set of probes one agent runs for other hosts'
// synthetic checks. version is the hex SHA-256 of the specs' canonical
// encoding (internal/probeconfig.Version); the empty set has the version of
// the empty encoding.
message ProbeConfig {
  string version = 1;
  repeated ProbeSpec probes = 2;
}

// ProbeSpec is one assigned slot: probe target_host_id's check check_key.
message ProbeSpec {
  string target_host_id = 1; // canonical lower-case UUID
  string check_key = 2;
  string plugin = 3;
  string params_json = 4; // canonical JSON, without the vantage parameters
  int32 interval_seconds = 5;
  string address = 6; // the target's address the probe dials
}

message ProbeResults {
  repeated ProbeResult results = 1;
}

// ProbeResult is a CheckResult for an assigned probe: the same fields,
// numbered after target_host_id, which names the probed host.
message ProbeResult {
  string target_host_id = 1; // canonical lower-case UUID
  string check_key = 2;
  string item = 3; // "" for whole-check metrics
  string metric = 4;
  google.protobuf.Timestamp at = 5;
  oneof observation {
    double value = 6;
    string label = 7;
    string error = 8; // the probe failed; no sample is stored
  }
}
