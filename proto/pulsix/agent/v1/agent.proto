syntax = "proto3";

package pulsix.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/noixdev/pulsix/internal/pb/agentpb";

service AgentService {
  // Enroll exchanges a one-time enrollment token and a certificate request
  // for the agent's first client certificate. It is the only method callable
  // without a client certificate; the agent pins the CA by the fingerprint
  // in its token before sending anything.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Renew issues a fresh certificate for the calling agent's key. Identity
  // comes from the client certificate; the swap revokes the previous serial
  // in the same transaction, so the agent reconnects with the new
  // certificate right away.
  rpc Renew(RenewRequest) returns (EnrollResponse);
  // AgentStream is the agent's long-lived bidirectional stream. The agent
  // sends heartbeats and facts; the manager may answer with acknowledgements.
  rpc AgentStream(stream AgentMessage) returns (stream ManagerMessage);
}

message EnrollRequest {
  string token = 1; // the one-time enrollment token
  string csr_pem = 2; // PEM "CERTIFICATE REQUEST"
  string name = 3; // requested hostname
  string version = 4; // agent build version
}

message EnrollResponse {
  string cert_pem = 1; // PEM leaf
  string ca_pem = 2; // PEM CA certificate
  string host_id = 3;
}

message RenewRequest {
  string csr_pem = 1; // PEM "CERTIFICATE REQUEST"
}

message AgentMessage {
  oneof body {
    Heartbeat heartbeat = 1; // periodic liveness signal
    Facts facts = 2; // gathered host facts
    CheckResults check_results = 3; // check measurement results
  }
}

message Heartbeat {
  string version = 1; // agent build version
  string config_version = 2; // what the agent is currently running
}

message Facts {
  map<string, string> values = 1;
}

message CheckResults {
  repeated CheckResult results = 1;
}

message CheckResult {
  string check_key = 1;
  string item = 2; // "" for whole-host metrics
  string metric = 3;
  google.protobuf.Timestamp at = 4;
  oneof observation {
    double value = 5;
    string label = 6;
    string error = 7; // collection failed; no sample is stored
  }
}

message ManagerMessage {
  bool ack = 1;
  optional CheckConfig check_config = 2;
}

message CheckConfig {
  string version = 1;
  repeated CheckSpec checks = 2;
}

message CheckSpec {
  string key = 1;
  string plugin = 2;
  string params_json = 3; // canonical JSON, as the version hashes it
  int32 interval_seconds = 4;
}
