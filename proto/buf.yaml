version: v2
lint:
  use:
    - STANDARD
  # RunEvent and ManagerDirective are the binding contract names
  # (task-3 brief): RunEvents is a bidirectional stream whose natural wire
  # types are RunEvent (worker → manager) and ManagerDirective (manager →
  # worker); ClaimJob and ReportResult follow the standard
  # <Method>Request/<Method>Response scheme.
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # Enroll and Renew intentionally share EnrollResponse (task-4 brief:
    # renewal produces the same certificate bundle as enrollment).
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    # WIRE_JSON, not FILE: FILE's FIELD_NO_DELETE is unconditional and so
    # forbids the only safe way to renumber a field (reserve, then never
    # reuse), which task-3 (v0.2e) needed for vault_credential_id -> 21.
    # Source breakage between this repo's own producer and consumer is the
    # Go compiler's job and it does that more precisely anyway; what this
    # proto actually needs guarded is wire compatibility between a manager
    # and a worker deployed as separate images at different versions, which
    # is exactly what WIRE_JSON's reserved-number-and-name rules check.
    - WIRE_JSON
