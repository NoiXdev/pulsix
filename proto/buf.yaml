version: v2
lint:
  use:
    - STANDARD
  # RunEvent and ManagerDirective are the binding contract names
  # (task-3 brief): RunEvents is a bidirectional stream whose natural wire
  # types are RunEvent (worker → manager) and ManagerDirective (manager →
  # worker); ClaimJob and ReportResult follow the standard
  # <Method>Request/<Method>Response scheme.
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # Enroll and Renew intentionally share EnrollResponse (task-4 brief:
    # renewal produces the same certificate bundle as enrollment).
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
